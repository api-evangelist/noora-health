name: Noora Health
description: >-
  Noora Health is a healthcare nonprofit that turns the time patients and their
  families spend in hospitals into an opportunity to learn high-impact health
  skills. Working through public and private health systems across South Asia,
  its Care Companion Program trains family caregivers at the bedside so they can
  care for their loved ones after discharge, reducing preventable complications
  and readmissions. Founded in 2014 and a Y Combinator-backed organization, Noora
  Health operates in India, Bangladesh, Indonesia, and Nepal and has trained tens
  of millions of caregivers and patients. It is a mission-driven organization
  rather than an API provider, and no public developer portal, API, or SDK surface
  was found during enrichment.
